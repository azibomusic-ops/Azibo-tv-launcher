

name: AZIBO TV Launcher APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project
        run: |
          mkdir extracted
          ZIP=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ZIP loyiha topilmadi"
            exit 1
          fi
          unzip -o "$ZIP" -d extracted
          PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -n 1)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AZIBO-TV-Launcher-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
